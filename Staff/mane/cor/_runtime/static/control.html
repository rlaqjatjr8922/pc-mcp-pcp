<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Control · 제어실</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141a;color:#edf1f6;font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #394452;background:#242e3a;color:inherit;border-radius:9px;padding:10px 14px}button:hover{background:#364455}button:disabled{opacity:.45;cursor:wait}header{display:flex;align-items:center;justify-content:space-between;padding:25px 34px;border-bottom:1px solid #303944}h1{margin:0;font-size:24px}small,.muted{color:#9baabc}header small{display:block;margin-top:5px}.stop{border-color:#eb6b71;color:#ffb4b8}main{max-width:1440px;margin:auto;padding:26px;display:grid;grid-template-columns:240px minmax(280px,1fr) minmax(280px,1fr);gap:22px}.panel{background:#1a212b;border:1px solid #303b48;border-radius:15px;padding:23px}aside{grid-row:span 2}h2{font-size:19px;margin:0 0 16px}.search{width:100%;margin-bottom:16px}input,select,textarea{width:100%;background:#111820;color:#edf1f6;border:1px solid #455364;padding:10px;border-radius:7px}textarea{min-height:95px;resize:vertical}label{display:block;margin:15px 0 7px;color:#c6d1df}nav button{width:100%;text-align:left;margin:3px 0;background:transparent;border-color:transparent}nav button.active{background:#234941;color:#9bf4ce}nav small{float:right}.primary{background:#90e9c5;color:#102820;border:0;font-weight:700;margin-top:20px;width:100%}.primary:hover{background:#b9ffe2}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:450px;overflow:auto;line-height:1.6}.preview{width:100%;max-height:450px;object-fit:contain;border-radius:8px;background:#10141a}.row{display:flex;gap:10px;flex-wrap:wrap}.status{margin-top:12px;overflow-wrap:anywhere;line-height:1.7}.error{color:#ffafb4}.good{color:#90e9c5}#fields{max-height:490px;overflow:auto;padding-right:5px}#desc{line-height:1.6}details{margin-top:16px}summary{cursor:pointer;color:#aab8c9}#screen{grid-column:2/4}#notice{min-height:24px;margin-top:12px}footer{padding:0 30px 25px;color:#8899ad}@media(max-width:1000px){main{grid-template-columns:200px 1fr}#output{grid-column:2}#screen{grid-column:2}aside{grid-row:span 3}}@media(max-width:650px){main{display:block;padding:14px}.panel{margin-bottom:16px}nav{display:flex;overflow:auto}nav button{min-width:110px}header{padding:20px;gap:15px}#fields{max-height:none}}
</style>
<header><div><h1>PC Control <span class="muted">/ 제어실</span></h1><small>내 PC를 확인하고 필요한 작업을 실행하세요.</small></div><button class="stop" id="stop">긴급 중지</button></header>
<main><aside class="panel"><h2>기능</h2><input class="search" id="search" placeholder="기능 검색" aria-label="기능 검색"><nav id="groups"></nav></aside>
<section class="panel"><h2 id="groupTitle">작업 선택</h2><select id="tool" aria-label="실행할 기능"></select><p id="desc" class="muted"></p><form id="form"><div id="fields"></div><button class="primary" id="run">실행</button></form><div id="notice" role="status"></div></section>
<section class="panel" id="output"><h2>연결 및 실행 결과</h2><button id="status">연결 확인</button><div id="connection" class="status muted">연결 확인을 누르면 Discord의 최신 PC 주소를 조회합니다.</div><hr style="border:0;border-top:1px solid #35404e;margin:22px 0"><p id="resultTitle" class="muted">아직 실행한 작업이 없습니다.</p><pre id="result" aria-live="polite"></pre></section>
<section class="panel" id="screen"><div class="row"><h2 style="flex:1">화면 미리보기</h2><button id="capture">화면 새로 캡처</button></div><p class="muted">캡처 버튼을 누를 때만 화면을 가져옵니다. 마우스 조작은 위 입력칸의 실제 픽셀 좌표를 사용하세요.</p><img id="preview" class="preview" alt="원격 PC 화면" hidden><p id="screenNote" class="muted">아직 캡처한 화면이 없습니다.</p></section></main><footer>변경 작업은 실행 버튼을 눌렀을 때만 적용됩니다. History·Log·Mission은 PC Control Server에 저장됩니다.</footer>
<script>
const nativeFetch=window.fetch.bind(window);
let apiKey=sessionStorage.getItem('pc-api-key')||prompt('PC Control API 키를 입력하세요.')||'';
if(apiKey)sessionStorage.setItem('pc-api-key',apiKey);
window.fetch=(url,options={})=>nativeFetch(url,{...options,headers:{...options.headers,'X-API-Key':apiKey}}).then(r=>{if(r.status===401){sessionStorage.removeItem('pc-api-key');throw Error('API 키를 확인한 후 새로고침해 주세요.')}return r});

const $=id=>document.getElementById(id);
const groups={recording:'로그',macro:'매크로',remote:'연결',mouse:'마우스',keyboard:'키보드',screen:'화면',window:'창 관리',files:'파일',history:'History',mission:'Mission',log:'이력 로그',system:'시스템',temp:'임시 폴더',verify:'화면 검증',watch:'감시',interaction:'질문·응답',safety:'안전',input:'통합 입력'};
const labels={config:'설정',run:'실행',powershell:'PowerShell',click:'클릭',double_click:'더블 클릭',right_click:'오른쪽 클릭',hover:'이동',scroll:'스크롤',drag:'드래그',position:'위치',type:'문자 입력',press:'키 누르기',hold:'키 유지',release:'키 해제',hotkey:'단축키',list:'목록',detail:'상세',create:'생성',edit:'수정',delete:'삭제',select:'선택',status:'상태',capture:'캡처',screenshot:'스크린샷',read:'읽기',save:'저장',open:'열기',copy:'복사',move:'이동',rename:'이름 변경',close:'닫기',find:'찾기',focus:'활성화',maximize:'최대화',minimize:'최소화'};
const fieldLabels={text:'내용',title:'제목',goal:'목표',plan:'단계 목록',mission_id:'작업 ID',path:'파일 경로',destination:'대상 경로',name:'이름',x:'X 좌표',y:'Y 좌표',key:'키',keys:'키 조합',width:'너비',height:'높이',hwnd:'창 ID',mode:'동작',options:'추가 옵션',content:'파일 내용',interval:'입력 간격 (초)',query:'검색어',monitor:'모니터 번호',target:'캡처 대상',reason:'사유',scope:'저장 범위',screenshot:'실행 후 스크린샷',start:'시작 시간 (시간대 포함)',end:'종료 시간 (시간대 포함)',macro_id:'실행할 매크로',command:'PowerShell 명령',privilege:'실행 권한',timeout:'제한 시간 (초)',limit:'최대 기록 수'};
let tools=[],currentGroup='remote',current=null;
function title(t){let g=t.name.split('_')[0],f=t.name.slice(g.length+1);return (labels[f]||f)+' · '+t.name}
function renderNav(){ $('groups').replaceChildren();for(const [g,name] of Object.entries(groups)){const n=tools.filter(t=>t.name.startsWith(g+'_')).length;if(!n)continue;let b=document.createElement('button');b.textContent=name+' ('+n+')';b.className=g===currentGroup?'active':'';b.onclick=()=>{currentGroup=g;renderNav();renderTools()};$('groups').append(b)}}
function renderTools(){let q=$('search').value.toLowerCase(),list=tools.filter(t=>t.name.startsWith(currentGroup+'_')&&(title(t)+' '+t.description).toLowerCase().includes(q));$('tool').replaceChildren();for(const t of list){let o=document.createElement('option');o.value=t.name;o.textContent=title(t);$('tool').append(o)}$('groupTitle').textContent=groups[currentGroup];selectTool()}
function selectTool(){current=tools.find(t=>t.name===$('tool').value);$('fields').replaceChildren();$('run').disabled=!current;$('desc').textContent=current?.description||'검색 결과가 없습니다.';if(current){renderFields();if(current.name==='macro_run')loadMacros()}}
async function loadMacros(){try{const response=await call('macro_list',{});let result=response.result||response;const previous=$('f-macro_id');if(!previous)return;const select=document.createElement('select');select.id=previous.id;select.dataset.key='macro_id';select.dataset.kind='string';select.required=true;for(const m of result.macros||[]){let o=document.createElement('option');o.value=m.id;o.textContent=m.title+' ('+m.count+'단계)';select.append(o)}previous.replaceWith(select)}catch(e){$('notice').textContent=e.message}}
function renderFields(mode){$('fields').replaceChildren();let schema=current.schema;if(schema.oneOf){let modes=schema.properties.mode.enum;mode=mode||modes[0];addField('mode',{type:'string',enum:modes},true,mode,()=>renderFields($('f-mode').value));schema=schema.oneOf.find(s=>s.properties.mode.const===mode)}for(const [key,spec] of Object.entries(schema.properties||{})){if(key==='mode')continue;addField(key,spec,(schema.required||[]).includes(key))}}
function addField(key,spec,required,value,onchange){let lab=document.createElement('label');lab.htmlFor='f-'+key;lab.textContent=(fieldLabels[key]||key)+(required?' *':'');$('fields').append(lab);let types=Array.isArray(spec.type)?spec.type:[spec.type];let type=types.find(t=>t!=='null');let input;if(spec.enum||type==='boolean'){input=document.createElement('select');let choices=spec.enum||[true,false];if(!required&&value===undefined&&!('default'in spec)){let o=document.createElement('option');o.value='';o.textContent='변경 안 함';input.append(o)}for(let c of choices){if(c===null)continue;let o=document.createElement('option');o.value=String(c);o.textContent=({none:'저장 안 함',program:'프로그램 조작만',all:'사람+프로그램 / 전체',query:'현재 값 유지',normal:'일반 권한',admin:'관리자 권한 (UAC)',true:'사용',false:'사용 안 함'})[String(c)]||String(c);input.append(o)}}else{input=document.createElement(type==='object'||type==='array'||(key==='text'||key==='command')?'textarea':'input');if(type==='integer'||type==='number'){input.type='number';input.step=type==='integer'?'1':'any';if(spec.minimum!==undefined)input.min=spec.minimum}}if(key==='start'||key==='end'){input.type='datetime-local';input.step='1';input.placeholder='';}input.id='f-'+key;input.dataset.key=key;input.dataset.kind=type||'string';input.required=required;let v=value!==undefined?value:spec.default;if(v!==undefined&&v!==null)input.value=typeof v==='object'?JSON.stringify(v,null,2):v;else if(type==='object'||type==='array')input.placeholder=type==='array'?'["첫 단계", "둘째 단계"]':'{}';if(onchange)input.onchange=onchange;$('fields').append(input)}
function args(){let result={};for(let el of $('fields').querySelectorAll('[data-key]')){let v=el.value;if(v===''&&!el.required)continue;let kind=el.dataset.kind;if(kind==='integer'||kind==='number')v=Number(v);else if(kind==='object'||kind==='array'){try{v=JSON.parse(v)}catch{throw Error((fieldLabels[el.dataset.key]||el.dataset.key)+' 입력 형식을 확인하세요.')}}else if(el.dataset.key==='start'||el.dataset.key==='end')v=new Date(v).toISOString();else if(kind==='boolean'||el.dataset.key==='screenshot')v=v==='query'?'query':v==='true';result[el.dataset.key]=v}return result}
async function call(name,arguments_){let r=await fetch('/control/call',{method:'POST',headers:{'Content-Type':'application/json','X-PC-Control':'1'},body:JSON.stringify({name,arguments:arguments_})});let data=await r.json();if(!data.ok)throw Error(data.error||'요청 실패');let image=data.content_items?.find(block=>block.type==='image');if(image){$('preview').src='data:'+image.mimeType+';base64,'+image.data;$('preview').hidden=false;$('screenNote').textContent='캡처 완료 · '+new Date().toLocaleTimeString()}return data.result}
function show(name,result){$('resultTitle').textContent=name+' · '+new Date().toLocaleTimeString();$('result').textContent=JSON.stringify(result,null,2)}
async function execute(name,a){$('notice').textContent='실행 중…';$('notice').className='muted';$('run').disabled=true;try{let result=await call(name,a);show(name,result);$('notice').textContent='응답을 받았습니다.'}catch(e){$('notice').textContent=e.message;$('notice').className='error'}finally{$('run').disabled=!current}}
$('form').onsubmit=e=>{e.preventDefault();try{let a=args();if(/_(delete|close)$/.test(current.name)&&!confirm('선택한 항목을 '+(/delete$/.test(current.name)?'삭제':'닫기')+'할까요?'))return;execute(current.name,a)}catch(e){$('notice').textContent=e.message;$('notice').className='error'}};
$('status').onclick=async()=>{let b=$('status');b.disabled=true;$('connection').textContent='연결 확인 중…';try{let r=await call('remote_status',{});$('connection').textContent=r.connected?'연결됨 · '+r.base_url:'연결 안 됨 · '+r.reason;$('connection').className='status '+(r.connected?'good':'error');show('연결 확인',r)}catch(e){$('connection').textContent=e.message}finally{b.disabled=false}};
$('stop').onclick=()=>execute('safety_kill_switch',{reason:'제어 화면에서 긴급 중지'});
$('capture').onclick=async()=>{let b=$('capture');b.disabled=true;try{let r=await call('screen_screenshot',{mode:'capture',target:{}});show('화면 캡처',r)}catch(e){$('screenNote').textContent=e.message}finally{b.disabled=false}};
$('tool').onchange=selectTool;$('search').oninput=renderTools;
fetch('/control/tools').then(r=>r.json()).then(r=>{tools=r.tools;renderNav();renderTools()}).catch(e=>{$('desc').textContent='도구 목록을 불러오지 못했습니다. 새로고침해 주세요.'});
</script></html>
